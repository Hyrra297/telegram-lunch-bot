app = 'telegram-lunch-bot'
primary_region = 'sin'

[build]

[env]
  PORT = '8080'
  DB_PATH = '/data/lunch_bot.db'
  EVENING_OPEN_TIME = '18:00'
  ADMIN_DIGEST_TIME = '19:00'

[[mounts]]
  source = 'lunch_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # 'off': bot Telegram + scheduler phải chạy liên tục, không phụ thuộc traffic HTTP.
  # Với 'stop', Fly dừng máy khi web không có request -> bot chết, job mở vote/chốt sổ không chạy.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
